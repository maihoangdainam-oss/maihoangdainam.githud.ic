<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Giới Thiệu Bản Thân</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0984e3;
            margin-bottom: 20px;
        }
        h1 {
            color: #2d3436;
            margin: 10px 0;
        }
        p {
            color: #636e72;
            font-size: 16px;
            line-height: 1.5;
        }
        .social-links {
            margin-top: 20px;
        }
        .social-links a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 20px;
            background: #0984e3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .social-links a:hover {
            background: #74b9ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ảnh đại diện -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Ảnh đại diện" class="avatar">
        
        <h1>Xin chào, tôi là Nam!</h1>
        <p>Chào mừng bạn đến với trang web cá nhân của tôi. Đây là trang web giới thiệu bản thân được xây dựng trực tiếp trên GitHub.</p>
        
        <div class="social-links">
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://github.com/maihoangdainam-oss" target="_blank">GitHub</a>
        </div>
    </div>

</body>
</html>
